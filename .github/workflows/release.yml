name: Build & Release

# Builds a single-file DynamicIslandNotifier.exe on a Windows machine.
# - Every push / pull request: build only (checks the code compiles).
# - Pushing a tag like v1.1.0: build, then publish a GitHub Release with the .exe files.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x64
        run: >
          dotnet publish DynamicIslandNotifier.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out/x64

      - name: Build ARM64
        run: >
          dotnet publish DynamicIslandNotifier.csproj -c Release -r win-arm64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out/arm64

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/x64/DynamicIslandNotifier.exe   release/DynamicIslandNotifier-x64.exe
          Copy-Item out/arm64/DynamicIslandNotifier.exe release/DynamicIslandNotifier-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandNotifier
          path: release/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dynamic Island ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/*.exe
