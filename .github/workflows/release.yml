name: Build & Release

# Builds a single-file DynamicIslandNotifier.exe on a Windows machine.
# - Every push / pull request: build (checks the code compiles).
# - Push to main with a new number in the VERSION file (e.g. 1.2.0): also
#   creates the tag v1.2.0 and publishes a GitHub Release with the .exe files.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to know whether this version was released

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tag = "v$v"
          $exists = [bool](git tag --list $tag)
          "version=$v"  >> $env:GITHUB_OUTPUT
          "tag=$tag"    >> $env:GITHUB_OUTPUT
          "release=$((-not $exists) -and ('${{ github.event_name }}' -eq 'push') -and ('${{ github.ref }}' -eq 'refs/heads/main'))".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, tag $tag exists: $exists"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x64
        run: >
          dotnet publish DynamicIslandNotifier.csproj -c Release -r win-x64
          -p:Version=${{ steps.ver.outputs.version }} --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out/x64

      - name: Build ARM64
        run: >
          dotnet publish DynamicIslandNotifier.csproj -c Release -r win-arm64
          -p:Version=${{ steps.ver.outputs.version }} --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out/arm64

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/x64/DynamicIslandNotifier.exe   release/DynamicIslandNotifier-x64.exe
          Copy-Item out/arm64/DynamicIslandNotifier.exe release/DynamicIslandNotifier-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandNotifier
          path: release/*.exe

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dynamic Island ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release/*.exe
