name: Build & Release

# Builds a single-file DynamicIslandNotifier.exe on a Windows machine.
# - Every push / pull request: build (checks the code compiles).
# - Push to main with a new number in the VERSION file (e.g. 1.2.0): also
#   creates the tag v1.2.0 and publishes a GitHub Release with the .exe files.
# - A VERSION like 2.8.0-beta.1 is published as a pre-release: GitHub's
#   "latest" link skips it, so only apps with "Nhận bản thử nghiệm (Beta)" on
#   get it. Only the 3 newest betas are kept; a finished release removes its betas.
# - Tags listed in .github/prune-releases.txt are removed (release + tag).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to know whether this version was released

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tag = "v$v"
          $num = $v.Split('-')[0]
          $beta = $v -match '-beta'
          "num=$num"   >> $env:GITHUB_OUTPUT
          "beta=$($beta.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $exists = [bool](git tag --list $tag)
          "version=$v"  >> $env:GITHUB_OUTPUT
          "tag=$tag"    >> $env:GITHUB_OUTPUT
          "release=$((-not $exists) -and ('${{ github.event_name }}' -eq 'push') -and ('${{ github.ref }}' -eq 'refs/heads/main'))".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, tag $tag exists: $exists"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests
        run: dotnet test tests/DynamicIslandNotifier.Tests -c Release --nologo

      - name: Build x64
        run: >
          dotnet publish DynamicIslandNotifier.csproj -c Release -r win-x64
          -p:Version=${{ steps.ver.outputs.version }} --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/x64

      - name: Build ARM64
        run: >
          dotnet publish DynamicIslandNotifier.csproj -c Release -r win-arm64
          -p:Version=${{ steps.ver.outputs.version }} --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/arm64

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/x64/DynamicIslandNotifier.exe   release/DynamicIslandNotifier-x64.exe
          Copy-Item out/arm64/DynamicIslandNotifier.exe release/DynamicIslandNotifier-arm64.exe
          # Installers (per-user, no admin) made with Inno Setup
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.num }}" /DArch=x64 installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.num }}" /DArch=arm64 installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Fingerprints the app's updater checks before installing a new version
          Get-ChildItem release/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandNotifier
          path: release/*

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dynamic Island ${{ steps.ver.outputs.tag }}${{ steps.ver.outputs.beta == 'true' && ' (thử nghiệm)' || '' }}
          prerelease: ${{ steps.ver.outputs.beta == 'true' }}
          make_latest: ${{ steps.ver.outputs.beta == 'true' && 'false' || 'true' }}
          body_path: RELEASE_NOTES.md
          files: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Tidy releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $remoteTags = git ls-remote --tags origin | ForEach-Object { ($_ -split 'refs/tags/')[1] } | Where-Object { $_ -notmatch '\^\{\}$' }
          $releases = gh release list --limit 200 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName }
          function Remove-Release($tag) {
            if (($remoteTags -notcontains $tag) -and ($releases -notcontains $tag)) { return }   # already gone
            gh release delete $tag --yes --cleanup-tag 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "Removed $tag" }
            else { git push origin ":refs/tags/$tag" 2>$null }   # a tag without a release
          }
          # 1. Tags listed by hand
          if (Test-Path .github/prune-releases.txt) {
            Get-Content .github/prune-releases.txt | ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^v\d' } | ForEach-Object { Remove-Release $_ }
          }
          # 2. Betas: keep the 3 newest; a finished release removes the betas before it
          $all = gh release list --limit 200 --json tagName,isPrerelease | ConvertFrom-Json
          function Key($t) { $m = [regex]::Match($t, '^v(\d+)\.(\d+)\.(\d+)(?:-beta\.?(\d+))?$'); if (-not $m.Success) { return $null }
            [version]::new([int]$m.Groups[1].Value, [int]$m.Groups[2].Value, [int]$m.Groups[3].Value, $(if ($m.Groups[4].Success) { [int]$m.Groups[4].Value } else { 9999 })) }
          $stable = $all | Where-Object { -not $_.isPrerelease } | ForEach-Object { Key $_.tagName } | Where-Object { $_ } | Sort-Object | Select-Object -Last 1
          $betas = $all | Where-Object { $_.isPrerelease } | ForEach-Object { [pscustomobject]@{ Tag = $_.tagName; Key = Key $_.tagName } } | Where-Object { $_.Key } | Sort-Object Key -Descending
          $i = 0
          foreach ($b in $betas) {
            $i++
            if ($i -gt 3 -or ($stable -and $b.Key -lt $stable)) { Remove-Release $b.Tag }
          }
          exit 0
